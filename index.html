<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청수책숲 | 희망도서 신청</title><style>:root{--g:#42b883;--gd:#258b65;--m:#dff5eb;--p:#eee8ff;--pd:#7868d8;--ink:#26332f}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:linear-gradient(150deg,#f8f5ff,#eefaf4 50%,#fff);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.hero{text-align:center;padding:35px 10px 25px}.pill{display:inline-block;background:#fff;border:1px solid #d9efe4;border-radius:999px;padding:8px 14px;color:var(--gd);font-weight:800;font-size:13px}.hero h1{font-size:clamp(30px,6vw,48px);margin:13px 0 6px;letter-spacing:-2px}.hero h1 b{color:var(--g)}.hero p{color:#66736e;margin:0}.card{background:rgba(255,255,255,.92);border:1px solid #e8e7ee;border-radius:24px;padding:25px;margin:16px 0;box-shadow:0 12px 35px rgba(55,80,68,.07)}.step{display:flex;align-items:center;gap:11px;margin-bottom:20px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--pd);font-weight:900}.step h2{font-size:19px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:13px;font-weight:800;display:block;margin:0 0 7px}input,textarea{width:100%;border:1px solid #dedde5;background:#fff;border-radius:14px;padding:14px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #dff5eb}textarea{min-height:90px;resize:vertical}.type{display:flex;gap:10px}.type label{flex:1;margin:0}.type input{display:none}.type span{display:block;text-align:center;padding:14px;border:1px solid #ddd;border-radius:14px;cursor:pointer}.type input:checked+span{background:var(--m);border-color:var(--g);color:var(--gd);font-weight:900}.book{background:#fbfaff;border:1px solid #ebe6ff;border-radius:18px;padding:16px;margin:10px 0}.bookhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}.remove{border:0;background:none;color:#999;cursor:pointer;font-size:13px}.add{width:100%;padding:13px;border:1px dashed #9d91e8;background:#faf8ff;color:#6959c8;border-radius:14px;font-weight:900;cursor:pointer;margin-top:10px}.notice{font-size:13px;color:#69756f;background:#f3faf6;padding:13px 15px;border-radius:13px;margin-top:12px}.submit{width:100%;border:0;border-radius:17px;padding:17px;background:linear-gradient(135deg,#4bc58d,#35a878);color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(53,168,120,.2)}.done{display:none;text-align:center;padding:25px}.done .icon{font-size:52px}.tiny{text-align:center;color:#9a9f9d;font-size:12px;margin-top:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:19px;border-radius:20px}.wrap{padding:15px 12px 50px}}</style></head><body><main class="wrap"><header class="hero"><span class="pill">🌳 천안청수고등학교 도서관</span><h1>청수<b>책숲</b></h1><p>읽고 싶은 책을 알려주세요. 도서관이 함께 찾아볼게요 📚</p></header><form id="f"><section class="card"><div class="step"><div class="num">1</div><h2>신청자 정보</h2></div><div class="grid"><div class="full"><label>성함 *</label><input id="name" required placeholder="이름을 입력해주세요"></div><div class="full"><label>신청자 구분 *</label><div class="type"><label><input type="radio" name="kind" value="학생" checked><span>🎒 학생</span></label><label><input type="radio" name="kind" value="교직원"><span>🧑‍🏫 교직원</span></label></div></div><div class="full" id="studentNo"><label>학번 *</label><input id="no" placeholder="예) 10101" inputmode="numeric"></div></div></section><section class="card"><div class="step"><div class="num">2</div><h2>희망도서 담기</h2></div><div id="books"></div><button type="button" class="add" id="add">＋ 도서 한 권 더 담기</button><div class="notice">💡 최대 4권까지 각각 입력할 수 있어요. 도서명 / 저자 / 출판사 순으로 적어주세요.</div></section><section class="card"><div class="step"><div class="num">3</div><h2>5권 이상 신청한다면</h2></div><label>추가 희망도서</label><textarea id="more" placeholder="예) 도서명 / 저자 / 출판사&#10;도서명 / 저자 / 출판사"></textarea></section><section class="card"><button class="submit" id="submit">🌿 희망도서 신청하기</button><div class="done" id="done"><div class="icon">📚🌱</div><h2>신청이 완료되었습니다!</h2><p>청수책숲에 새로운 책 한 권이 자라날지도 몰라요.</p></div></section></form><div class="tiny">천안청수고등학교 도서관 · 청수책숲</div></main><iframe name="sink" hidden></iframe><script>const ENTRY={name:'806878537',kind:'1943031859',no:'1224051363',books:['508876629','2073935860','1631602256','2146982119'],more:'1770749347'};const endpoint='https://docs.google.com/forms/d/e/1FAIpQLSdwUBa_vLE8jAtdpA9h7rYTu8wBWSnstilxnAmlbqft5E55DQ/formResponse';let count=0;const books=document.getElementById('books');function addBook(){if(count>=4)return;count++;let d=document.createElement('div');d.className='book';d.dataset.i=count-1;d.innerHTML='<div class="bookhead"><span>📖 '+count+'번째 도서'+(count===1?' *':'')+'</span>'+(count>1?'<button type="button" class="remove">삭제</button>':'')+'</div><input class="bookval" '+(count===1?'required':'')+' placeholder="도서명 / 저자 / 출판사">';d.querySelector('.remove')?.addEventListener('click',()=>d.remove());books.appendChild(d);if(count>=4)document.getElementById('add').style.display='none'}addBook();document.getElementById('add').onclick=addBook;document.querySelectorAll('input[name=kind]').forEach(r=>r.onchange=()=>{if(r.checked&&r.value==='학생'){studentNo.style.display='block';no.required=true}else if(r.checked){studentNo.style.display='none';no.required=false;no.value=''}});no.required=true;document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(!e.target.reportValidity())return;let x=document.createElement('form');x.method='POST';x.action=endpoint;x.target='sink';x.style.display='none';function put(k,v){let i=document.createElement('input');i.name='entry.'+k;i.value=v||'';x.appendChild(i)}put(ENTRY.name,name.value);put(ENTRY.kind,document.querySelector('input[name=kind]:checked').value);put(ENTRY.no,no.value);let vals=[...document.querySelectorAll('.book')].map(b=>({i:+b.dataset.i,v:b.querySelector('.bookval').value}));ENTRY.books.forEach((id,i)=>put(id,(vals.find(z=>z.i===i)||{}).v));put(ENTRY.more,more.value);document.body.appendChild(x);x.submit();submit.style.display='none';done.style.display='block';setTimeout(()=>x.remove(),3000)});</script></body></html>
